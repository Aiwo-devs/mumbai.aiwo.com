[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing (react-router-dom) — without this, a direct load or
# refresh on any route other than "/" (e.g. /services/iv-therapy) 404s,
# since there's no matching file on disk for Netlify to serve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build assets are safe to cache indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
